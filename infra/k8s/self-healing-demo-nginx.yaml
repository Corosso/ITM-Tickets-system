# =============================================================================
# ITM-Tickets Global — Self-healing en K8s (variante con imagen pública)
#
# Variante del manifest principal pero usando nginx:alpine (descargado de
# Docker Hub) en vez de la imagen local itm-tickets-local/inventory-api.
#
# Cuándo usar este archivo en vez del otro:
#   - Si Docker Desktop tiene activado "Use containerd for pulling and storing
#     images" (Settings → General), las imágenes construidas con `docker build`
#     no son visibles para Kubernetes y kubelet falla con ErrImageNeverPull.
#   - Funciona en cualquier configuración de Docker Desktop sin tocar
#     settings: nginx:alpine pesa ~8 MB y se baja en pocos segundos.
#
# El comportamiento de self-healing que se verifica es el mismo: el Deployment
# Controller reconcilia el estado deseado (replicas=1) cuando borramos el
# Pod, y kubelet arranca uno nuevo. La rúbrica pide demostrar self-healing
# de Kubernetes; el contenido del contenedor no altera el patrón.
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: itm-tickets
  labels:
    app.kubernetes.io/name: itm-tickets-global
    app.kubernetes.io/part-of: world-tour-2026

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: itm-tickets
  labels:
    app: inventory-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-api
  progressDeadlineSeconds: 60
  template:
    metadata:
      labels:
        app: inventory-api
    spec:
      restartPolicy: Always
      containers:
      - name: inventory-api
        image: nginx:alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 1
          periodSeconds: 5
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
      terminationGracePeriodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: inventory-api
  namespace: itm-tickets
spec:
  type: ClusterIP
  selector:
    app: inventory-api
  ports:
  - name: http
    port: 80
    targetPort: http
