apiVersion: v1
kind: Service
metadata:
  name: inventory-api
  namespace: itm-tickets
  labels:
    app: inventory-api
spec:
  type: ClusterIP
  selector:
    app: inventory-api
  ports:
    - name: http-health
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 5002
      targetPort: 5002
