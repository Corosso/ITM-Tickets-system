apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: itm-tickets
  labels:
    app: order-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
    spec:
      containers:
        - name: order-api
          image: itm-tickets/order-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: itm-tickets-secrets
                  key: postgres-orders-connection
            - name: ConnectionStrings__RabbitMQ
              valueFrom:
                secretKeyRef:
                  name: itm-tickets-secrets
                  key: rabbitmq-connection
            - name: services__inventory-api__http__0
              value: http://inventory-api.itm-tickets.svc.cluster.local:8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
